[package]
name = "slate-cli"
version = "0.5.0"
edition = "2021"
build = "build.rs"
description = "Cross-platform terminal beautification kit for macOS and Linux"
homepage = "https://github.com/MoonMao42/slate"
repository = "https://github.com/MoonMao42/slate"
documentation = "https://github.com/MoonMao42/slate#readme"
license = "MIT"
keywords = ["terminal", "theme", "macos", "linux", "cli"]
categories = ["command-line-utilities"]
include = [
    "/src/**",
    "/tests/**",
    "/benches/**",
    "/themes/**",
    "/resources/**",
    "/scripts/bake-audio.sh",
    "/scripts/build-dev.sh",
    "/scripts/curate-sfx.sh",
    "/scripts/dev-space.sh",
    "/scripts/install-dev.sh",
    "/scripts/parse_tape_sfx.py",
    "/scripts/render-theme-gallery.sh",
    "/build.rs",
    "/build_metadata.rs",
    "/Cargo.toml",
    "/README.md",
    "/README.zh-CN.md",
    "/install.sh",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/dist-workspace.toml",
    "!**/.DS_Store",
]

[package.metadata.dist]
dist = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "slate"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-io = "2"
atomic-write-file = "0.1"
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = "4.6"
cliclack = "0.5.4"
color-eyre = "0.6"
console = "0.16"
crossterm = "0.27"
futures-lite = "2"
getrandom = "0.4"
libc = "0.2"
kdl = { version = "4.7.1", default-features = false, features = ["span"] }
jsonc-parser = { version = "0.33.1", default-features = false }
rayon = "1"
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
thiserror = "1"
toml = "0.8"
toml_edit = "0.22"
url = "2"
unicode-segmentation = "=1.12.0"
uuid = { version = "1", features = ["v5"] }
which = "5"
zbus = "4"
# Stored/Deflate archives only; avoid optional encryption and native codecs.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.dist]
inherits = "release"

# Repeated local CLI checks: retain dev assertions without accumulating large
# incremental caches or debugger symbols for every integration-test binary.
# Strip linker symbols too; use the normal dev profile for symbolic debugging.
[profile.local-check]
inherits = "dev"
debug = 0
incremental = false
strip = "symbols"

[dev-dependencies]
assert_cmd = "2"
criterion = { version = "0.5", features = ["html_reports"] }
insta = "1"
notify = "6"
predicates = "3"
regex = "1"
rstest = "0.18"
# Private socket-pair D-Bus fixtures; no session bus or portal daemon is used.
zbus = { version = "4", features = ["p2p"] }

[features]
default = []
# Gates integration tests that shell out to `nvim --headless`.
# CI enables this via rhysd/action-setup-vim@v1 + `cargo test --features has-nvim`.
has-nvim = []
# Opt-in runtime checks against disposable, explicitly addressed tmux servers.
has-tmux = []
# Opt-in native Fish completion and shell-loader checks; CI enables this on Linux.
has-fish = []

[[bench]]
name = "performance"
harness = false

[lints.clippy]
doc_lazy_continuation = "allow"
